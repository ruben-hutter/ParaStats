<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="ParaStats — a self-hosted paragliding flight log: every flight on a map, with career stats, climb detection and a personal thermal map." />
    <meta name="theme-color" content="#070b24" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)" />
    <title>ParaStats — paragliding flight log</title>
    <link
      rel="preload"
      href="/fonts/comfortaa-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/comfortaa-latin-600-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/comfortaa-latin-700-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230f1640'/%3E%3Cpath d='M8 18c4-6 12-6 16 0l-2.5 1.5c-3-4.5-8-4.5-11 0z' fill='%2300b2ff'/%3E%3Ccircle cx='24' cy='9' r='3' fill='%23ff6800'/%3E%3C/svg%3E"
    />
    <!-- Apply the saved theme before first paint (sidekik pattern). Keep the
         key in sync with src/theme.ts. -->
    <script>
      (function () {
        var pref = "system";
        try {
          pref = localStorage.getItem("parastats-theme") || "system";
        } catch (e) {}
        var dark =
          pref === "dark" ||
          (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
